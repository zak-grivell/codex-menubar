[package]
name = "codex-menubar"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std", "NSApplication", "NSButton", "NSCell", "NSControl", "NSEvent",
  "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication",
  "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
